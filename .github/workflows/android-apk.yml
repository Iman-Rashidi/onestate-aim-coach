name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Download EfficientDet Lite0 model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite" \
            --output app/src/main/assets/efficientdet-lite0.tflite
          test -s app/src/main/assets/efficientdet-lite0.tflite
          ls -lh app/src/main/assets/efficientdet-lite0.tflite

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace

      - name: Verify and summarize JUnit XML
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          if not reports:
              print("::error::JUnit XML reports were not generated.")
              sys.exit(1)

          tests = failures = errors = skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              for suite in suites:
                  tests += int(suite.attrib.get("tests", "0"))
                  failures += int(suite.attrib.get("failures", "0"))
                  errors += int(suite.attrib.get("errors", "0"))
                  skipped += int(suite.attrib.get("skipped", "0"))

          summary = (
              f"### Unit test results\n\n"
              f"- Tests: **{tests}**\n"
              f"- Failures: **{failures}**\n"
              f"- Errors: **{errors}**\n"
              f"- Skipped: **{skipped}**\n"
              f"- JUnit XML files: **{len(reports)}**\n"
          )
          print(summary)
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)

          if tests == 0:
              print("::error::JUnit reports exist but contain zero tests.")
              sys.exit(1)
          if failures or errors:
              print("::error::Unit tests failed.")
              sys.exit(1)
          PY

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onestate-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onestate-aim-coach-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
