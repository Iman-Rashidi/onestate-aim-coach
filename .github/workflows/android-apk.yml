name: Android APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Download EfficientDet Lite0 model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/object_detection/android/lite-model_efficientdet_lite0_detection_metadata_1.tflite" \
            --output app/src/main/assets/efficientdet-lite0.tflite
          test -s app/src/main/assets/efficientdet-lite0.tflite
          ls -lh app/src/main/assets/efficientdet-lite0.tflite

      - name: Initialize build log
        run: |
          mkdir -p "$RUNNER_TEMP"
          : > "$RUNNER_TEMP/build.log"

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Append build log to step summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            echo '### Last 60 build log lines' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 "$RUNNER_TEMP/build.log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Build log was not created.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save failure log to ci-log branch
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf .
          mkdir -p artifacts
          cp "$RUNNER_TEMP/build.log" artifacts/build.log
          git add artifacts/build.log
          git commit -m "ci: preserve failed build log"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: onestate-aim-coach-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
